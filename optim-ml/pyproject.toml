[project]
name = "optim-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "kaleido>=1.4.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "notebook>=7.6.3",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pip>=26.2.1",
    "plotly>=7.1.0",
    "pyzmq>=27.2.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
